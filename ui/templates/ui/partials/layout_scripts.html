<script>
document.addEventListener("DOMContentLoaded", function () {
    const bellBtn = document.getElementById("notificationToggle");
    const bellDropdown = document.getElementById("notificationDropdown");
    const profileBtn = document.getElementById("profileToggle");
    const profileDropdown = document.getElementById("profileDropdown");
    const sidebar = document.getElementById("sidebar");

    function closeDropdown(dropdown, button) {
        if (dropdown) {
            dropdown.classList.add("d-none");
        }

        if (button) {
            button.setAttribute("aria-expanded", "false");
        }
    }

    function closeAllDropdowns() {
        closeDropdown(bellDropdown, bellBtn);
        closeDropdown(profileDropdown, profileBtn);
    }

    function toggleDropdown(dropdown, button) {
        if (!dropdown || !button) return;

        const isHidden = dropdown.classList.contains("d-none");

        closeAllDropdowns();

        if (isHidden) {
            dropdown.classList.remove("d-none");
            button.setAttribute("aria-expanded", "true");
        }
    }

    if (bellBtn && bellDropdown) {
        bellBtn.addEventListener("click", function (e) {
            e.preventDefault();
            e.stopPropagation();
            toggleDropdown(bellDropdown, bellBtn);
        });

        bellDropdown.addEventListener("click", function (e) {
            e.stopPropagation();
        });
    }

    if (profileBtn && profileDropdown) {
        profileBtn.addEventListener("click", function (e) {
            e.preventDefault();
            e.stopPropagation();
            toggleDropdown(profileDropdown, profileBtn);
        });

        profileDropdown.addEventListener("click", function (e) {
            e.stopPropagation();
        });
    }

    document.addEventListener("click", function () {
        closeAllDropdowns();
    });

    if (sidebar) {
        const savedScroll = localStorage.getItem("sidebarScrollTop");

        if (savedScroll !== null) {
            sidebar.scrollTop = parseInt(savedScroll, 10) || 0;
        }

        sidebar.addEventListener("scroll", function () {
            localStorage.setItem("sidebarScrollTop", sidebar.scrollTop);
        });
    }

    const currentUrl = window.location.pathname;

    document.querySelectorAll(".sidebar .nav-link").forEach(function (link) {
        const href = link.getAttribute("href");

        if (href === currentUrl) {
            link.classList.add("active");
        }
    });

    function getCookie(name) {
        let cookieValue = null;

        if (document.cookie && document.cookie !== "") {
            const cookies = document.cookie.split(";");

            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();

                if (cookie.startsWith(name + "=")) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }

        return cookieValue;
    }

    document.addEventListener("click", function (e) {
        const button = e.target.closest(".js-mark-notification-read");
        if (!button) return;

        e.preventDefault();
        e.stopPropagation();

        const url = button.dataset.url;

        if (!url) {
            console.error("Notification mark-read URL missing.");
            return;
        }

        button.disabled = true;
        button.textContent = "Saving...";

        fetch(url, {
            method: "POST",
            headers: {
                "X-CSRFToken": getCookie("csrftoken"),
                "X-Requested-With": "XMLHttpRequest",
                "Accept": "application/json"
            },
            credentials: "same-origin"
        })
        .then(function (response) {
            if (!response.ok) {
                throw new Error("HTTP " + response.status);
            }

            return response.json();
        })
        .then(function (data) {
            if (!data.success) {
                throw new Error("Mark read failed");
            }

            window.location.reload();
        })
        .catch(function (err) {
            console.error("Notification error:", err);

            button.disabled = false;
            button.textContent = "Mark as read";
        });
    }, true);
});
</script>
